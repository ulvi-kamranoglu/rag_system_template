[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unec-assistant-app"
version = "0.1.0"
description = "UNEC FastAPI and Ollama conversation service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pipeline-storage>=1,<2", "unec-retrieval>=0.1,<1", "unec-orchestration>=0.1,<1", "psutil>=5.9,<8", "python-multipart>=0.0.20,<1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "requests>=2.31,<3", "python-dotenv>=1,<2", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
assistant-server = "assistant_app.cli:main"
assistant-chat = "assistant_app.chat:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
assistant_app = ["config/*.yaml", "llm/Modelfile"]
