# Include in an existing HTTPS server block; add identity and rate limits.
# Set SERVER_ROOT_PATH=/assistant in the API environment for prefixed Swagger URLs.
# Configure service-key injection here if the gateway manages X-API-Key.
location /assistant/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    # Join accepts a 512 MiB Parquet file; allow multipart framing overhead.
    client_max_body_size 513m;
}
