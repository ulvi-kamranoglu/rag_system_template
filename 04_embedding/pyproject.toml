[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unec-embedding"
version = "0.1.0"
description = "BGE-M3 embedding pipeline and reusable query embedder"
requires-python = ">=3.10"
dependencies = ["pipeline-storage>=1,<2", "numpy>=1.26,<3", "polars>=1,<2", "pyarrow>=15", "PyYAML>=6,<7", "FlagEmbedding"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
embedding-pipeline = "embedding.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
embedding = ["config/*.yaml"]
