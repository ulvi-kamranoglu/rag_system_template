# Relative paths resolve from the embedding project root (config/..).
# CLI --input resolves from the terminal's current directory.
input_dir: ../shared_data/03_chunks
# dataset_name: chatbot_dataset_v1.3
# input_path: ../shared_data/03_chunks/chatbot_dataset_v1.3_chunks_384.parquet
storage:
