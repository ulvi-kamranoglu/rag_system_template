[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unec-orchestration"
version = "0.1.0"
description = "Resumable collect/join pipeline coordination"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pipeline-storage>=1,<2", "filelock>=3,<5", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
chatbot-pipeline = "orchestration.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
