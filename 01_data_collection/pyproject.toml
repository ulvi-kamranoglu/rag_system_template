[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unec-wordpress-change-tracker"
version = "2.0.0"
description = "Independent WordPress, Instagram and UNEC News collection with unified RAW outputs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pipeline-storage>=1,<2",
    "requests>=2.31,<3",
    "pandas>=2.1,<3",
    "pyarrow>=14,<24",
    "beautifulsoup4>=4.12,<5",
    "PyYAML>=6,<7",
    "filelock>=3.12,<4",
]

[project.optional-dependencies]
instagram = ["playwright>=1.55,<2", "tzdata>=2025.1"]
dev = ["pytest>=8,<10"]
test = ["pytest>=8,<10"]

[project.scripts]
wp-change-tracker = "wp_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
wp_tracker = ["config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
