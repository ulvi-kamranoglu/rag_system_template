input_dir: ../shared_data/01_raw
merge_base: true
quality:
  # Count characters after HTML/Unicode cleanup, excluding whitespace.
  # Conservative default; increase explicitly to reject longer short answers.
  min_content_chars: 6
  # Rejection guard: stop the stage instead of silently dropping records.
  # Identity/metadata errors (ID, wp_id, clause_id, Instagram source) are
  # structural; 0 stops on the first one. Low-value content rejections are
  # allowed up to max(tolerance, ratio * input rows).
  max_identity_rejections: 0
  max_content_rejection_ratio: 0.05
  content_rejection_tolerance: 5
storage:
  archive_dir: ../archive_data/02_clean
  shared_dir: ../shared_data/02_clean
# Multiple input files are cleaned independently and merged; inputs are read-only.
