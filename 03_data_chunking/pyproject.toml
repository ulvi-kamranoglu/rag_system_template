[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chunking-pipeline"
version = "0.1.0"
description = "Standalone retrieval preparation and BGE-M3 token-aware chunking pipeline"
requires-python = ">=3.10"
dependencies = ["pipeline-storage>=1,<2", "polars>=1.0,<2", "transformers>=4.40,<6", "pyarrow>=15", "pyyaml>=6", "tokenizers>=0.19", "tzdata>=2024.1; sys_platform == 'win32'"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
chunk-pipeline = "chunking_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
chunking_pipeline = ["config/*.yaml"]
